<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Data-MC Matching: Updated Feature Audit Plot Browser</title><style>*{box-sizing:border-box}body{margin:0;font:16px Arial,sans-serif;background:#f4f7fa;color:#152e44}.top{display:flex;gap:20px;align-items:center;flex-wrap:wrap;background:#102b43;color:white;padding:21px 28px}.top h1{font-size:23px;margin:0 20px 0 0}.top label{font-size:14px}.top select{padding:8px 14px;font-size:16px;border-radius:6px;margin-left:7px}.sub{padding:12px 30px;color:#506779;display:flex;gap:20px;align-items:center}.sub a{color:#12748b}.gallery{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;padding:8px 20px 22px}.figure{border:1px solid #cedae3;display:block;background:white;border-radius:7px;padding:4px;position:relative;color:#176d82;text-decoration:none}.figure img{width:100%;height:auto;aspect-ratio:1000/650;object-fit:contain;display:block}.figure h2{font-size:15px;margin:0;padding:8px 12px}.warning{color:#bb4b40}.bottom{padding:10px 30px 40px;color:#62798a;font-size:13px}@media(max-width:950px){.gallery{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:620px){.gallery{grid-template-columns:1fr}}</style></head><body><div class="top"><h1>Data–MC audit</h1><label>Variable <select id="var"><option value="ftof_energy_1A">FTOF 1A — energy</option><option value="ftof_time_1A">FTOF 1A — time</option><option value="ftof_path_1A">FTOF 1A — path</option><option value="ftof_energy_1B">FTOF 1B — energy</option><option value="ftof_time_1B">FTOF 1B — time</option><option value="ftof_path_1B" selected>FTOF 1B — path</option><option value="ftof_energy_2">FTOF 2 — energy</option><option value="ftof_time_2">FTOF 2 — time</option><option value="ftof_path_2">FTOF 2 — path</option><option value="pcal_energy">PCAL — energy</option><option value="pcal_time">PCAL — time</option><option value="pcal_path">PCAL — path</option><option value="ecin_energy">ECIN — energy</option><option value="ecin_time">ECIN — time</option><option value="ecin_path">ECIN — path</option><option value="ecout_energy">ECOUT — energy</option><option value="ecout_time">ECOUT — time</option><option value="ecout_path">ECOUT — path</option><option value="nphe_htcc">HTCC — nphe</option><option value="nphe_ltcc">LTCC — nphe</option><option value="beta">beta</option><option value="chi2pid">chi2pid</option><option value="p">p</option><option value="theta">theta</option><option value="phi">phi</option><option value="sector">sector</option><option value="vz">vz</option></select></label><label>Selection <select id="mode"><option value="kp_sidis">SIDIS-selected K⁺</option><option value="kp">Inclusive EB–K⁺</option></select></label></div><div class="sub"><span>Updated MC/data overlays + residuals + audit scores in each (p, θ) cell.</span><a id="source" target="_blank">View GitHub folder ↗</a></div><main class="gallery" id="gallery"></main><div class="bottom">All images load directly from the public GitHub repository; this browser requires an internet connection. For some variables, the inclusive audit may not contain the corresponding plot.</div><script>const BASE="https://raw.githubusercontent.com/mariakzurek/suli2026_pid/week8/figures/feature_audit_updated";const combos=[['1-2','5-15'],['1-2','15-25'],['1-2','25-35'],['2-3','5-15'],['2-3','15-25'],['2-3','25-35'],['3-5','5-15'],['3-5','15-25'],['3-5','25-35']];const v=document.getElementById('var'),m=document.getElementById('mode'),g=document.getElementById('gallery');function update(){const feat=v.value,mode=m.value;g.innerHTML=combos.map(([p,t])=>{const url=`${BASE}/${mode}/${feat}/${feat}_p${p}_theta${t}.png`;return `<a class="figure" href="${url}" target="_blank" title="Open PNG full resolution"><img loading="lazy" src="${url}" alt="${feat}: p${p} theta${t}" onerror="this.style.opacity=.08;this.nextElementSibling.style.display='block'"><span style="display:none;position:absolute;top:40%;left:20%;right:20%;text-align:center;color:#ce594e">Image not available for this selection</span><h2>p = ${p} GeV/c · θ = ${t}° ↗</h2></a>`}).join('');document.getElementById('source').href=`https://github.com/mariakzurek/suli2026_pid/tree/week8/figures/feature_audit_updated/${mode}/${feat}`;let share=new URL(location);share.searchParams.set('variable',feat);share.searchParams.set('mode',mode);try{history.replaceState(null,'',share)}catch(e){}};const q=new URLSearchParams(location.search);if(q.has('variable')&&[...v.options].some(o=>o.value===q.get('variable')))v.value=q.get('variable');if(q.get('mode')==='kp')m.value='kp';v.addEventListener('change',update);m.addEventListener('change',update);update();</script></body></html>
