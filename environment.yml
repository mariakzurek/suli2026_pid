# Environment for batch-job execution (slurm) on ifarm.
# Interactive notebook work is done via JLab JupyterHub (https://jupyterhub.jlab.org),
# which has its own pre-installed jupyter stack — do NOT install jupyterlab here.
# This env contains only the runtime libraries needed for training/evaluation scripts.

name: suli2026_pid
channels:
  - conda-forge
dependencies:
  - python=3.11
  - numpy
  - pandas
  - matplotlib
  - scikit-learn
  - uproot
  - awkward
  - pip
  - pip:
    - lightgbm
    - xgboost
